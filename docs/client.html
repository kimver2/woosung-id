<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>우성아이디 — 고객 현장 진행 현황</title>
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 14px 40px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand img {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      object-fit: cover;
      border: 1px solid #e2e8f0;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.2;
    }
    .brand-sub {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
    }
    .refresh-btn {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
    }
    .refresh-btn:hover { background: #f8fafc; }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .hero-card {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #e2e8f0;
      border-top: 4px solid #334155;
    }
    .site-title {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 6px;
      line-height: 1.3;
      color: #0f172a;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      font-size: 12.5px;
      color: #475569;
      font-weight: 600;
    }
    .meta-row a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 700;
    }
    .meta-row a:hover { text-decoration: underline; }
    .prog-wrap {
      margin-top: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .prog-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 7px;
    }
    .prog-bar {
      height: 10px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }
    .prog-fill {
      height: 100%;
      border-radius: 999px;
      background: #10b981;
      transition: width 0.35s ease;
    }
    .notice-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.6;
      color: #1e3a8a;
      font-weight: 600;
      margin-bottom: 12px;
      white-space: pre-line;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .kpi-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 11px 10px;
      text-align: center;
    }
    .kpi-lbl {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
    }
    .kpi-val {
      font-size: 18px;
      font-weight: 900;
      margin-top: 3px;
      color: #0f172a;
    }
    .sec-title {
      font-size: 14.5px;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .pay-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .pay-sum-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 9px 10px;
    }
    .pay-sum-lbl {
      font-size: 11px;
      color: #64748b;
      font-weight: 700;
    }
    .pay-sum-val {
      font-size: 14px;
      font-weight: 800;
      margin-top: 2px;
      color: #0f172a;
    }
    .pay-stage-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .pay-stage-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 11px;
      border-radius: 9px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      font-size: 12.5px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .badge-done { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .badge-prog { background: #dbeafe; color: #1d4ed8; border: 1px solid #93c5fd; }
    .badge-plan { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .task-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
    }
    .task-row.is-done { background: #f8fafc; }
    .task-row.is-today { background: #eff6ff; border-color: #93c5fd; }
    .task-name {
      font-size: 13.5px;
      font-weight: 800;
      color: #0f172a;
    }
    .task-date {
      font-size: 11.5px;
      font-weight: 600;
      color: #64748b;
      margin-top: 2px;
    }
    .empty-card {
      text-align: center;
      padding: 48px 20px;
    }
    .footer {
      text-align: center;
      font-size: 11.5px;
      color: #94a3b8;
      margin-top: 16px;
      font-weight: 600;
    }
    .cal-head-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .cal-nav-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cal-nav-btn {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      border-radius: 7px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .cal-nav-btn:hover { background: #f8fafc; }
    .cal-month-lbl {
      font-size: 14.5px;
      font-weight: 800;
      color: #0f172a;
      min-width: 92px;
      text-align: center;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      border-top: 1px solid #e2e8f0;
      border-left: 1px solid #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
    }
    .cal-dow {
      background: #f8fafc;
      border-right: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 2px;
      color: #475569;
    }
    .cal-cell {
      min-height: 68px;
      border-right: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
      padding: 4px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 3px;
      cursor: pointer;
    }
    .cal-cell.is-other { background: #f8fafc; opacity: 0.45; cursor: default; }
    .cal-cell.is-today { background: #eff6ff; }
    .cal-cell.is-selected { outline: 2px solid #2563eb; outline-offset: -2px; }
    .cal-day-num {
      font-size: 11px;
      font-weight: 800;
      color: #334155;
      line-height: 1.2;
    }
    .cal-cell.is-today .cal-day-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #2563eb;
      color: #ffffff;
    }
    .cal-chip {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }
    .cal-chip.done { background: #dcfce7; color: #15803d; }
    .cal-chip.prog { background: #dbeafe; color: #1d4ed8; }
    .cal-chip.plan { background: #f1f5f9; color: #475569; }
    .cal-day-detail {
      margin-top: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .more-btn {
      width: 100%;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #1e293b;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
    }
    .more-btn:hover { background: #f1f5f9; }
    .hero-card.partner-mode { border-top-color: #d97706; }
    .scope-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .scope-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
    }
    .scope-pill.all { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .scope-pill.task { background: #fef3c7; color: #92400e; border: 1px solid #f59e0b; }
    .partner-notice-box {
      background: #fffbeb;
      border: 1.5px solid #fcd34d;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .partner-notice-title {
      font-size: 12.5px;
      font-weight: 800;
      color: #92400e;
      margin-bottom: 5px;
    }
    .partner-notice-body {
      font-size: 13px;
      line-height: 1.6;
      color: #78350f;
      font-weight: 600;
      white-space: pre-line;
    }
    .access-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .access-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 11px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 12.5px;
    }
    .access-val {
      font-weight: 700;
      color: #0f172a;
      word-break: break-word;
    }
    .access-pw {
      font-weight: 800;
      color: #0f766e;
    }
    .copy-pill-btn {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      font-size: 11.5px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .copy-pill-btn:hover { background: #f1f5f9; }
    .copy-pill-btn.primary {
      background: #fffbeb;
      border-color: #f59e0b;
      color: #b45309;
    }
    .copy-pill-btn.primary:hover { background: #fef3c7; }
    .task-memo {
      font-size: 11.5px;
      color: #475569;
      font-weight: 600;
      margin-top: 3px;
      line-height: 1.4;
    }
    .client-toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(16px);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 9999;
      max-width: 90vw;
      text-align: center;
    }
    .client-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    @media (max-width: 520px) {
      .pay-summary { grid-template-columns: 1fr; }
      .site-title { font-size: 18px; }
      .cal-cell { min-height: 56px; padding: 3px 2px; }
      .cal-chip { font-size: 9px; padding: 1px 3px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <img src="./icon-192.png" alt="우성아이디">
        <div>
          <div class="brand-title">우성아이디</div>
          <div class="brand-sub" id="shareBrandSub">실시간 현장 진행 현황</div>
        </div>
      </div>
      <button type="button" class="refresh-btn" onclick="loadClientShare()">🔄 새로고침</button>
    </div>

    <div id="clientShareRoot">
      <div class="card empty-card">
        <div style="font-size:28px;margin-bottom:8px;">⏳</div>
        <div id="loadingStatusMsg" style="font-size:14px;font-weight:700;color:#475569;">현장 진행 현황을 불러오는 중입니다...</div>
      </div>
    </div>

    <div class="footer" id="clientShareFooter">© 우성아이디 인테리어</div>
  </div>
  <div id="clientToast" class="client-toast" role="status" aria-live="polite"></div>

  <script>
    const SUPABASE_URL = "https://uyqvguzglviqegxmxqyn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_f8JwxMgpgs6AVSEumSIV2g_KlK6o9GA";
    const clientViewState = {
      mode: "client",
      payload: null,
      updatedAt: "",
      calYear: new Date().getFullYear(),
      calMonth: new Date().getMonth() + 1,
      selectedYmd: "",
      showAllTasks: false,
      showDoneTasks: false
    };
    let toastTimer = null;

    function isPartnerRequest() {
      try {
        const params = new URLSearchParams(location.search);
        return (params.get("mode") || "").trim().toLowerCase() === "partner";
      } catch (_) {
        return false;
      }
    }

    function applyShareChrome(isPartner) {
      document.title = isPartner ? "우성아이디 — 반장님 현장 작업 현황" : "우성아이디 — 고객 현장 진행 현황";
      const subEl = document.getElementById("shareBrandSub");
      if (subEl) subEl.textContent = isPartner ? "반장님 전용 현장 · 작업 안내" : "실시간 현장 진행 현황";
      const loadEl = document.getElementById("loadingStatusMsg");
      if (loadEl) loadEl.textContent = isPartner ? "반장님 작업 일정을 불러오는 중입니다..." : "현장 진행 현황을 불러오는 중입니다...";
    }

    function showShareToast(msg) {
      const el = document.getElementById("clientToast");
      if (!el) return;
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.remove("show");
      }, 2400);
    }

    async function copyShareText(text, successMsg) {
      const val = String(text || "");
      if (!val) return;
      let copied = false;
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(val);
          copied = true;
        } catch (_) {}
      }
      if (!copied) {
        try {
          const ta = document.createElement("textarea");
          ta.value = val;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          copied = document.execCommand("copy");
          document.body.removeChild(ta);
        } catch (_) {}
      }
      showShareToast(copied ? (successMsg || "📋 클립보드에 복사되었습니다.") : "⚠️ 복사에 실패했습니다. 직접 선택해 복사해 주세요.");
    }

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function fmtKrw(n) {
      const num = Number(n) || 0;
      return num.toLocaleString("ko-KR") + "원";
    }

    function fmtUpdated(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      return `${y}-${m}-${day} ${hh}:${mm}`;
    }

    function renderError(icon, title, desc) {
      document.getElementById("clientShareRoot").innerHTML = `
        <div class="card empty-card">
          <div style="font-size:34px;margin-bottom:10px;">${icon}</div>
          <div style="font-size:16px;font-weight:800;color:#0f172a;margin-bottom:6px;">${esc(title)}</div>
          <div style="font-size:13px;color:#64748b;line-height:1.5;">${esc(desc)}</div>
        </div>
      `;
    }

    function getVisiblePartnerTasks(p) {
      const tasks = (p && Array.isArray(p.tasks)) ? p.tasks : [];
      const scopeMode = p && p.scopeMode === "task" ? "task" : "all";
      const target = String((p && p.targetTaskName) || "").trim();
      if (scopeMode === "task" && target) {
        return tasks.filter((t) => t && String(t.taskName || "").trim() === target);
      }
      return tasks;
    }

    function buildFallbackPartnerGuideText(p) {
      const tasks = getVisiblePartnerTasks(p);
      const isTaskScope = p && p.scopeMode === "task" && String(p.targetTaskName || "").trim();
      const scopeLabel = isTaskScope ? String(p.targetTaskName).trim() : `전체 공정 일정 (${tasks.length}건)`;
      const designerLine = p.manager ? `${p.manager}${p.managerPhone ? " | " + p.managerPhone : ""}` : "미지정";
      const lines = [
        `[우성아이디 현장 작업 안내]`,
        `━━━━━━━━━━━━━━━━━━`,
        `■ 현장명: ${p.siteName || ""}`,
        `■ 공종: ${scopeLabel}`,
        `■ 작업일자: ${p.periodText || "-"}`,
        `■ 담당 디자이너 : ${designerLine}`
      ];
      if (p.superintendent) lines.push(`■ 현장 소장 : ${p.superintendent}`);
      lines.push(`━━━━━━━━━━━━━━━━━━`);
      lines.push(`📍 현장 주소: ${p.address || "(주소 미등록 - 담당자 문의)"}`);
      lines.push(`🔑 도어락 비번: ${p.doorPassword || "(비밀번호 미등록 - 담당자 문의)"}`);
      if (p.officePhone) lines.push(`📞 관리사무소: ${p.officePhone}`);
      if (p.siteMemo) lines.push(`⚠️ 특이사항 / 주차: ${p.siteMemo}`);
      if (p.noticeText && String(p.noticeText).trim()) {
        lines.push(`━━━━━━━━━━━━━━━━━━`);
        lines.push(`📌 작업 지시사항:\n${String(p.noticeText).trim()}`);
      }
      lines.push(`━━━━━━━━━━━━━━━━━━`);
      lines.push(`※ 현장 진입 및 작업 전 특이사항을 반드시 확인해 주세요.`);
      return lines.join("\n");
    }

    function copyPartnerGuideText() {
      const p = clientViewState.payload;
      if (!p) return;
      const text = String(p.guideText || "").trim() || buildFallbackPartnerGuideText(p);
      copyShareText(text, "📋 반장님 작업 안내문이 복사되었습니다!");
    }

    function copyPartnerField(fieldKey, label) {
      const p = clientViewState.payload;
      if (!p || !p[fieldKey]) return;
      copyShareText(String(p[fieldKey]), `📋 ${label || "정보"}가 복사되었습니다.`);
    }

    function formatSuperintendentHtml(raw) {
      const str = String(raw || "").trim();
      if (!str) return "";
      const escaped = esc(str);
      return escaped.replace(/(0\d{1,2}[-\s]?\d{3,4}[-\s]?\d{4})/g, (m) => {
        const cleanTel = m.replace(/[^0-9+]/g, "");
        return `<a href="tel:${cleanTel}">${m}</a>`;
      });
    }

    function rerenderActiveShareView() {
      if (!clientViewState.payload) return;
      if (clientViewState.mode === "partner") {
        renderPartnerShareView(clientViewState.payload, clientViewState.updatedAt);
      } else {
        renderShareView(clientViewState.payload, clientViewState.updatedAt);
      }
    }

    async function loadClientShare() {
      const params = new URLSearchParams(location.search);
      const token = (params.get("token") || "").trim();
      const isPartnerReq = isPartnerRequest();
      clientViewState.mode = isPartnerReq ? "partner" : "client";
      applyShareChrome(isPartnerReq);
      if (!token) {
        renderError("🔗", "유효하지 않은 공유 링크입니다.", "전달받으신 링크 주소를 다시 확인해 주세요.");
        return;
      }
      try {
        const key = (isPartnerReq ? "partner_share::" : "client_share::") + token;
        const url = `${SUPABASE_URL}/rest/v1/ws_state_store?key=eq.${encodeURIComponent(key)}&select=payload,updated_at`;
        const res = await fetch(url, {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: "Bearer " + SUPABASE_ANON_KEY
          },
          cache: "no-store"
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const rows = await res.json();
        const row = Array.isArray(rows) ? rows[0] : null;
        const p = row && row.payload ? row.payload : null;
        if (!p || p.enabled === false) {
          renderError("🔒", "공유가 종료되었거나 만료된 링크입니다.", "현장 담당자에게 최신 공유 링크를 요청해 주세요.");
          return;
        }
        if (isPartnerReq && p.shareType !== "partner") {
          renderError("🔗", "유효하지 않은 반장님 공유 링크입니다.", "전달받으신 링크 주소를 다시 확인해 주세요.");
          return;
        }
        if (!isPartnerReq && p.shareType === "partner") {
          renderError("🔗", "유효하지 않은 고객 공유 링크입니다.", "전달받으신 링크 주소를 다시 확인해 주세요.");
          return;
        }
        clientViewState.payload = p;
        clientViewState.updatedAt = row.updated_at || p.updatedAt || "";
        clientViewState.showAllTasks = false;
        clientViewState.showDoneTasks = false;
        clientViewState.selectedYmd = "";
        const now = new Date();
        const curYm = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
        const tasks = isPartnerReq ? getVisiblePartnerTasks(p) : (Array.isArray(p.tasks) ? p.tasks : []);
        const hasCurMonthTask = tasks.some((t) => String(t.date || "").startsWith(curYm) || String(t.endDate || "").startsWith(curYm));
        if (hasCurMonthTask || !tasks.length) {
          clientViewState.calYear = now.getFullYear();
          clientViewState.calMonth = now.getMonth() + 1;
        } else {
          const dated = tasks.map((t) => String(t.date || "")).filter((d) => /^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
          const target = dated.length ? dated[dated.length - 1] : "";
          if (target) {
            clientViewState.calYear = Number(target.slice(0, 4));
            clientViewState.calMonth = Number(target.slice(5, 7));
          }
        }
        rerenderActiveShareView();
      } catch (err) {
        console.error(err);
        renderError("⚠️", "현장 정보를 불러오지 못했습니다.", "잠시 후 다시 새로고침을 눌러 주세요.");
      }
    }

    function shiftClientCalMonth(delta) {
      let y = clientViewState.calYear;
      let m = clientViewState.calMonth + delta;
      if (m < 1) { m = 12; y--; }
      else if (m > 12) { m = 1; y++; }
      clientViewState.calYear = y;
      clientViewState.calMonth = m;
      clientViewState.selectedYmd = "";
      rerenderActiveShareView();
    }

    function goClientCalToday() {
      const now = new Date();
      clientViewState.calYear = now.getFullYear();
      clientViewState.calMonth = now.getMonth() + 1;
      clientViewState.selectedYmd = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
      rerenderActiveShareView();
    }

    function selectClientCalDay(ymd) {
      clientViewState.selectedYmd = (clientViewState.selectedYmd === ymd) ? "" : ymd;
      rerenderActiveShareView();
    }

    function toggleClientShowAllTasks() {
      clientViewState.showAllTasks = !clientViewState.showAllTasks;
      rerenderActiveShareView();
    }

    function togglePartnerDoneTasks() {
      clientViewState.showDoneTasks = !clientViewState.showDoneTasks;
      rerenderActiveShareView();
    }

    function expandClientCalendarMap(tasks, todayYmd) {
      const map = {};
      tasks.forEach((t) => {
        const s = String(t.date || "").slice(0, 10);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return;
        const e = (t.endDate && /^\d{4}-\d{2}-\d{2}$/.test(String(t.endDate).slice(0, 10))) ? String(t.endDate).slice(0, 10) : s;
        const startDt = new Date(Number(s.slice(0, 4)), Number(s.slice(5, 7)) - 1, Number(s.slice(8, 10)));
        const endDt = new Date(Number(e.slice(0, 4)), Number(e.slice(5, 7)) - 1, Number(e.slice(8, 10)));
        const cur = new Date(startDt);
        let guard = 0;
        while (cur <= endDt && guard < 90) {
          const ymd = `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, "0")}-${String(cur.getDate()).padStart(2, "0")}`;
          if (!map[ymd]) map[ymd] = [];
          map[ymd].push(t);
          cur.setDate(cur.getDate() + 1);
          guard++;
        }
      });
      return map;
    }

    function buildClientCalendarCardHtml(tasks, todayYmd) {
      const y = clientViewState.calYear;
      const m = clientViewState.calMonth;
      const firstDow = new Date(y, m - 1, 1).getDay();
      const daysInMonth = new Date(y, m, 0).getDate();
      const ymPrefix = `${y}-${String(m).padStart(2, "0")}`;
      const evMap = expandClientCalendarMap(tasks, todayYmd);

      const dows = ["일", "월", "화", "수", "목", "금", "토"];
      let gridHtml = dows.map((d, idx) => `<div class="cal-dow" style="${idx === 0 ? "color:#dc2626;" : idx === 6 ? "color:#2563eb;" : ""}">${d}</div>`).join("");
      for (let i = 0; i < firstDow; i++) {
        gridHtml += `<div class="cal-cell is-other"></div>`;
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const ymd = `${ymPrefix}-${String(d).padStart(2, "0")}`;
        const dayTasks = evMap[ymd] || [];
        const isToday = ymd === todayYmd;
        const isSel = clientViewState.selectedYmd === ymd;
        const chips = dayTasks.slice(0, 3).map((t) => {
          const isDone = t.status === "완료";
          const isProg = !isDone && ((t.date && t.endDate && t.date <= todayYmd && t.endDate >= todayYmd) || t.date === todayYmd || String(t.status || "").includes("진행"));
          const cls = isDone ? "done" : (isProg ? "prog" : "plan");
          return `<div class="cal-chip ${cls}" title="${esc(t.taskName)}">${esc(t.taskName)}</div>`;
        }).join("") + (dayTasks.length > 3 ? `<div style="font-size:9.5px;font-weight:800;color:#64748b;padding-left:2px;">+${dayTasks.length - 3}건</div>` : "");
        const dow = (firstDow + d - 1) % 7;
        gridHtml += `
          <div class="cal-cell ${isToday ? "is-today" : ""} ${isSel ? "is-selected" : ""}" onclick="selectClientCalDay('${ymd}')">
            <div class="cal-day-num" style="${!isToday && dow === 0 ? "color:#dc2626;" : !isToday && dow === 6 ? "color:#2563eb;" : ""}">${d}</div>
            ${chips}
          </div>`;
      }
      const totalCells = firstDow + daysInMonth;
      const tail = (7 - (totalCells % 7)) % 7;
      for (let i = 0; i < tail; i++) {
        gridHtml += `<div class="cal-cell is-other"></div>`;
      }

      let dayDetailHtml = "";
      if (clientViewState.selectedYmd) {
        const selTasks = evMap[clientViewState.selectedYmd] || [];
        dayDetailHtml = `
          <div class="cal-day-detail">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
              <strong style="font-size:12.5px;color:#0f172a;">📅 ${esc(clientViewState.selectedYmd)} 일정 (${selTasks.length}건)</strong>
              <button type="button" class="cal-nav-btn" style="padding:2px 7px;font-size:11px;" onclick="selectClientCalDay('${esc(clientViewState.selectedYmd)}')">닫기</button>
            </div>
            ${selTasks.length ? selTasks.map((t) => {
              const isDone = t.status === "완료";
              const isProg = !isDone && ((t.date && t.endDate && t.date <= todayYmd && t.endDate >= todayYmd) || t.date === todayYmd || String(t.status || "").includes("진행"));
              const badgeCls = isDone ? "badge-done" : (isProg ? "badge-prog" : "badge-plan");
              const badgeTxt = isDone ? "✅ 완료" : (isProg ? "🔨 진행 중" : "예정");
              const extraPartnerInfo = (clientViewState.mode === "partner" && (t.partner || t.memo))
                ? `<div style="font-size:11px;color:#475569;margin-top:2px;">${[t.partner ? `👷 ${esc(t.partner)}` : "", t.memo ? `📝 ${esc(t.memo)}` : ""].filter(Boolean).join(" · ")}</div>`
                : "";
              return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-top:1px dashed #cbd5e1;font-size:12px;"><div style="min-width:0;"><span style="font-weight:700;color:#1e293b;">${esc(t.taskName)}</span>${extraPartnerInfo}</div><span class="badge ${badgeCls}">${badgeTxt}</span></div>`;
            }).join("") : `<div style="font-size:12px;color:#64748b;">해당 날짜에 등록된 공정이 없습니다.</div>`}
          </div>`;
      }

      return `
        <div class="card">
          <div class="cal-head-bar">
            <div class="sec-title" style="margin:0;"><span>📅 월간 공정 캘린더</span></div>
            <div class="cal-nav-group">
              <button type="button" class="cal-nav-btn" onclick="shiftClientCalMonth(-1)">◀</button>
              <span class="cal-month-lbl">${y}년 ${m}월</span>
              <button type="button" class="cal-nav-btn" onclick="shiftClientCalMonth(1)">▶</button>
              <button type="button" class="cal-nav-btn" onclick="goClientCalToday()">오늘</button>
            </div>
          </div>
          <div class="cal-grid">${gridHtml}</div>
          ${dayDetailHtml}
        </div>
      `;
    }

                <div class="access-val access-pw">${esc(p.doorPassword || "미등록 (담당자 문의)")}</div>
              </div>
              ${p.doorPassword ? `<button type="button" class="copy-pill-btn" onclick="copyPartnerField('doorPassword', '도어락 비밀번호')">복사</button>` : ""}
            </div>
            ${p.officePhone ? `
              <div class="access-row">
                <div style="min-width:0;">
                  <div style="font-size:11px;font-weight:700;color:#64748b;margin-bottom:2px;">📞 관리사무소</div>
                  <div class="access-val">${esc(p.officePhone)}</div>
                </div>
                <a class="copy-pill-btn" href="tel:${esc(String(p.officePhone).replace(/[^0-9+]/g, ""))}">전화</a>
              </div>
            ` : ""}
            <div class="access-row">
              <div style="min-width:0;">
                <div style="font-size:11px;font-weight:700;color:#64748b;margin-bottom:2px;">⚠️ 현장 특이사항 · 주차 안내</div>
                <div class="access-val" style="font-weight:600;color:#334155;white-space:pre-line;">${esc(p.siteMemo || "특이사항 없음")}</div>
              </div>
            </div>
          </div>
        </div>
      `;

      const calHtml = buildClientCalendarCardHtml(tasks, todayYmd);

      const renderPartnerTaskRow = (t) => {
        const isDone = t.status === "완료";
        const isToday = !isDone && ((t.date && t.endDate && t.date <= todayYmd && t.endDate >= todayYmd) || t.date === todayYmd || String(t.status || "").includes("진행"));
        const badgeCls = isDone ? "badge-done" : (isToday ? "badge-prog" : "badge-plan");
        const badgeTxt = isDone ? "✅ 완료" : (isToday ? "🔨 진행 중" : "예정");
        const dateStr = (t.date && t.endDate && t.endDate !== t.date) ? `${t.date} ~ ${t.endDate}` : (t.date || t.dateDisplay || "일정 조율 중");
        return `
          <div class="task-row ${isDone ? "is-done" : (isToday ? "is-today" : "")}">
            <div style="min-width:0;">
              <div class="task-name">${esc(t.taskName)}</div>
              <div class="task-date">📅 ${esc(dateStr)}${t.partner ? ` · 👷 ${esc(t.partner)}` : ""}</div>
              ${t.memo ? `<div class="task-memo">📝 ${esc(t.memo)}</div>` : ""}
            </div>
            <span class="badge ${badgeCls}">${badgeTxt}</span>
          </div>
        `;
      };

      const remainTasks = tasks.filter((t) => t.status !== "완료");
      const doneTasks = tasks.filter((t) => t.status === "완료");
      const visibleRemain = clientViewState.showAllTasks ? remainTasks : remainTasks.slice(0, 5);
      const hiddenRemainCount = Math.max(0, remainTasks.length - visibleRemain.length);

      let scheduleBodyHtml = "";
      if (isTaskScope) {
        scheduleBodyHtml = tasks.length
          ? tasks.map(renderPartnerTaskRow).join("")
          : `<div style="font-size:13px;color:#64748b;font-weight:700;text-align:center;padding:16px 0;">선택된 공종(${esc(targetName)})의 등록된 일정이 없습니다.</div>`;
      } else {
        const remainHtml = visibleRemain.length
          ? visibleRemain.map(renderPartnerTaskRow).join("")
          : `<div style="font-size:13px;color:#15803d;font-weight:700;text-align:center;padding:16px 0;">모든 공정이 완료되었습니다. 🎉</div>`;
        const moreRemainBtn = remainTasks.length > 5 ? `
          <button type="button" class="more-btn" onclick="toggleClientShowAllTasks()">
            ${clientViewState.showAllTasks ? "▲ 5개만 보기 (접기)" : `▼ 나머지 ${hiddenRemainCount}개 일정 더보기 (남은 ${remainTasks.length}건)`}
          </button>
        ` : "";
        const doneToggleHtml = doneTasks.length ? `
          <button type="button" class="more-btn" style="margin-top:8px;" onclick="togglePartnerDoneTasks()">
            ${clientViewState.showDoneTasks ? `▲ 완료된 작업 접기 (${doneTasks.length}건)` : `▼ 완료된 작업 ${doneTasks.length}건 보기`}
          </button>
          ${clientViewState.showDoneTasks ? `<div class="task-list" style="margin-top:8px;">${doneTasks.map(renderPartnerTaskRow).join("")}</div>` : ""}
        ` : "";
        scheduleBodyHtml = remainHtml + moreRemainBtn + doneToggleHtml;
      }

      document.getElementById("clientShareRoot").innerHTML = `
        <div class="card hero-card partner-mode">
          <div class="scope-row">
            <span class="scope-pill ${isTaskScope ? "task" : "all"}">${isTaskScope ? `🔧 ${esc(targetName)} 공종만 표시` : "👷 전체 공정 일정 공유"}</span>
          </div>
          <h1 class="site-title">${esc(p.siteName || "현장 작업 안내")}</h1>
          <div class="meta-row">
            ${mgrContactsHtml}
            ${suptHtml}
            ${p.periodText ? `<span>🗓️ 작업기간: ${esc(p.periodText)}</span>` : ""}
            ${p.address ? `<span>📍 ${esc(p.address)} <a href="https://map.naver.com/p/search/${encodeURIComponent(p.address)}" target="_blank" rel="noopener noreferrer">지도 ↗</a></span>` : ""}
          </div>
          <div class="prog-wrap">
            <div class="prog-head">
              <span>${isTaskScope ? `${esc(targetName)} 공정 진행률` : "전체 공정 진행률"}</span>
              <span style="font-size:15px;">${pct}% (${doneCnt}/${totalCnt}건 완료)</span>
            </div>
            <div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:#d97706;"></div></div>
          </div>
        </div>

        ${noticeCardHtml}

        ${accessCardHtml}

        <div class="kpi-grid">
          <div class="kpi-box">
            <div class="kpi-lbl">${isTaskScope ? `${esc(targetName)} 공정` : "전체 공정"}</div>
            <div class="kpi-val">${totalCnt}건</div>
          </div>
          <div class="kpi-box">
            <div class="kpi-lbl">완료 공정</div>
            <div class="kpi-val" style="color:#15803d;">${doneCnt}건</div>
          </div>
          <div class="kpi-box">
            <div class="kpi-lbl">진행 · 예정</div>
            <div class="kpi-val" style="color:#b45309;">${remainCnt}건</div>
          </div>
        </div>

        ${calHtml}

        <div class="card">
          <div class="sec-title">
            <span>${isTaskScope ? `🛠️ ${esc(targetName)} 작업 일정` : "🛠️ 남은 작업 일정"}</span>
            <span style="font-size:12px;color:#64748b;font-weight:800;">완료 ${doneCnt}/${totalCnt}</span>
          </div>
          <div class="task-list">${scheduleBodyHtml}</div>
        </div>
      `;

      const upd = fmtUpdated(updatedAt);
      document.getElementById("clientShareFooter").textContent = `© 우성아이디 인테리어${upd ? " · 최종 업데이트: " + upd : ""}`;
    }

    loadClientShare();
  </script>
</body>
</html>
